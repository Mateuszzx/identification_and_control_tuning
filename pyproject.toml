[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "control>=0.10.2",
    "ipykernel>=7.4.0",
    "lmfit>=1.3.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "polars>=2.1.0",
    "pygad>=3.9.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/plantid", "src/pidtune"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
