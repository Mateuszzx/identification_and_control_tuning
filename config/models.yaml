# Structures identification tries, in order. Copy a block to add another one.
# kind: inertial (integrators: 0) or integrator (integrators: 1), unless integrators is set
# order: number of real lags (τ s + 1)
# integrators: power of 1/s. 2 is a double integrator. Overrides kind.
# zeros: number of real derivative factors (ζ s + 1). Must not exceed integrators + order.
# friction: Coulomb dead-zone on the plant input
#
# - name: integrator 2, lag 1, derivative 1 + friction
#   integrators: 2
#   order: 1
#   zeros: 1
#   friction: true

- name: inertial 1
  kind: inertial
  order: 1
  friction: false

- name: inertial 1 + friction
  kind: inertial
  order: 1
  friction: true

- name: inertial 2
  kind: inertial
  order: 2
  friction: false

- name: inertial 2 + friction
  kind: inertial
  order: 2
  friction: true

- name: inertial 3
  kind: inertial
  order: 3
  friction: false

- name: inertial 3 + friction
  kind: inertial
  order: 3
  friction: true

- name: integrator + friction
  kind: integrator
  order: 0
  friction: true

- name: integrator, lag 1 + friction
  kind: integrator
  order: 1
  friction: true

- name: integrator, lag 2 + friction
  kind: integrator
  order: 2
  friction: true
