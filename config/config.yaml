# Paths are relative to the repository root.
# Identification reads the log and writes the plant. Tuning reads that plant.

identify:
  log: data/fr_prop_pid.csv
  out: model/plant.json
  # Proportional gain of the loop that recorded the log. Not fitted.
  kp: 2.0
  # Structures to try. Add an entry in that file to fit another model.
  models: config/models.yaml
  # Residual evaluations allowed while fitting each structure.
  max_nfev: 300

tune:
  plant: model/plant.json
  dt: 0.015

  # Setpoint levels and how long to hold each level.
  hold: 6.0
  levels: [0, -30, 0, -60, 0, -90, 0, 30, 0, 60, 0, 90, 0]
  
  # Proportional, integral, and derivative gains to search.
  kp: [40.0, 150.0]
  ki: [0.0, 30.0]
  kd: [0.0, 6.5]

  # Weighted integral of squared setpoint error.
  we: 1.0

  # powell, pygad, or pso. All three minimize the same simulated ISE.
  method: pygad
  # generations and population are shared by PyGAD and the particle swarm.
  # Powell ignores them. The other PyGAD entries are ignored by pso.
  generations: 400
  population: 50
  parents: 16
  selection: sss
  crossover: single_point
  mutation: random
  mutation_by_replacement: true
  elitism: 1
  seed: 1
  # Particle swarm. PyGAD and Powell ignore these.
  inertia: 0.7
  cognitive: 1.5
  social: 1.5
  # Powell. PyGAD and the particle swarm ignore these.
  maxfev: 40
  xtol: 1.0e-3
  ftol: 1.0e-3
